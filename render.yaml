# Blueprint Render pour le backend ProbloxDev (API FastAPI).
# Déploiement: `render blueprint launch` (CLI) ou "New > Blueprint" dans le
# dashboard Render en pointant sur ce repo. Voir docs/DEPLOY.md.
services:
  - type: web
    name: probloxdev-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "./scripts/setup_sandbox.sh"
    # Le PATH de build de Render (render-build-tool, etc.) ne doit pas être
    # écrasé par une variable d'env PATH globale (ça a cassé un déploiement
    # réel — voir l'historique git). Aftman est donc ajouté au PATH
    # uniquement pour le process de démarrage, ici. $HOME n'est pas persisté
    # entre le build et le runtime sur Render (testé en conditions réelles),
    # d'où AFTMAN_ROOT pointé dans le checkout du repo plutôt que $HOME.
    startCommand: 'PATH="$AFTMAN_ROOT/bin:$PATH" uvicorn problox.web:app --host 0.0.0.0 --port $PORT'
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AFTMAN_ROOT
        value: "/opt/render/project/src/.aftman"
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ROBLOX_OAUTH_CLIENT_ID
        sync: false
      - key: ROBLOX_OAUTH_CLIENT_SECRET
        sync: false
      - key: ROBLOX_OAUTH_REDIRECT_URI
        # URL réellement assignée par Render au premier déploiement (le nom
        # "probloxdev-api" était pris ailleurs dans le compte, d'où le
        # suffixe) — adapte si tu redéploies dans un autre workspace.
        value: "https://probloxdev-api-h8pi.onrender.com/api/auth/roblox/callback"
      - key: FRONTEND_URL
        value: "https://probloxdev.vercel.app"
      - key: ALLOWED_ORIGINS
        value: "https://probloxdev.vercel.app"
    healthCheckPath: /api/health

  # Bot Discord Hermès (voir docs/HERMES_BOT.md). Contrairement au service web
  # ci-dessus, Render n'a pas de plan gratuit pour les "Background Workers" —
  # il faut au minimum le plan "starter" payant pour un process qui tourne en
  # continu (un bot Discord maintient une connexion websocket permanente, pas
  # de requêtes HTTP ponctuelles). Désactive/supprime ce bloc tant que tu n'as
  # pas de credentials Discord/DeepSeek et que tu ne veux pas payer ce service.
  - type: worker
    name: probloxdev-hermes-bot
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: "pip install -e '.[hermes]'"
    startCommand: "problox hermes"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: HERMES_ADMIN_USER_IDS
        sync: false
      - key: HERMES_ALLOWED_GUILD_IDS
        sync: false
