# Blueprint Render pour le backend ProbloxDev (API FastAPI).
# Déploiement: `render blueprint launch` (CLI) ou "New > Blueprint" dans le
# dashboard Render en pointant sur ce repo. Voir docs/DEPLOY.md.
services:
  - type: web
    name: probloxdev-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "./scripts/setup_sandbox.sh"
    # Le PATH de build de Render (render-build-tool, etc.) ne doit pas être
    # écrasé par une variable d'env PATH globale (ça a cassé un déploiement
    # réel — voir l'historique git). Aftman est donc ajouté au PATH
    # uniquement pour le process de démarrage, ici. $HOME n'est pas persisté
    # entre le build et le runtime sur Render (testé en conditions réelles),
    # d'où AFTMAN_ROOT pointé dans le checkout du repo plutôt que $HOME.
    startCommand: 'PATH="$AFTMAN_ROOT/bin:$PATH" uvicorn problox.web:app --host 0.0.0.0 --port $PORT'
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AFTMAN_ROOT
        value: "/opt/render/project/src/.aftman"
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ROBLOX_OAUTH_CLIENT_ID
        sync: false
      - key: ROBLOX_OAUTH_CLIENT_SECRET
        sync: false
      - key: ROBLOX_OAUTH_REDIRECT_URI
        value: "https://probloxdev-api.onrender.com/api/auth/roblox/callback"  # adapte à l'URL réellement assignée par Render (visible après création)
      - key: FRONTEND_URL
        value: "https://probloxdev.vercel.app"
      - key: ALLOWED_ORIGINS
        value: "https://probloxdev.vercel.app"
    healthCheckPath: /api/health
